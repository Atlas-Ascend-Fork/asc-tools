  # pkg_inc/driver/*，旧路径 2027-06-30 下线。报错文本含 include/driver 路径段时，
  # 先核对 toolkit 版本：>=9.1.0 改用新路径；9.0 域旧路径仍合法（另有原因）。
  # 裁决令主体在 harness/knowledge/static_rules.yaml（include_driver_path_migration）。
  note: 'include/driver/* -> pkg_inc/driver/* since CANN 9.1.0 (old path offline 2027-06-30): fatal error
    under include/driver on a >=9.1.0 toolkit means rewrite the include path, not a missing dependency.'
