# ── FP8/MX architecture-gating mismatch ─────────────────────────────────────
# Evidence combines SDK static assertions with declaration and definition
# guards; this family is conditional rather than a deterministic source fix.
#   · "MmadMx not support data type on current device!"——v9.1.0
#     impl/basic_api/dav_3510/kernel_operator_mm_impl.h:608/627/653/675；
#     v9.0.0 无 MmadMx（9.1 新 API）。
#   · "LoadData 2dv2 with scale matrix only support fp4/fp8 dtype on current
#     device!"——v9.0.0 dav_c310:320/395 与 v9.1.0 dav_3510:312/362 同文。
#   · 2201 面 MmadMx「声明无条件可见、定义 3510 门控」（intf 声明 vs
#     kernel_operator_mm_intf_impl.h:386 #if 3510）→ 实例化即
#     implicit instantiation of undefined template（clang 形态）。
#   · 在已核版本的设备编译分支，fp8_e4m3fn_t 可退化为 uint8_t
#     （impl/utils/common_types.h）；Host/CPU_DEBUG 分支须分别核实，别名可见不证明 FP8 运算语义。
# 只提供条件核验线索；修复须保留用户已确定的目标、dtype 与 scale 契约。
- id: mx_fp8_arch_scope_mismatch
  regex: 'MmadMx not support data type on current device|LoadData 2dv2 with scale
    matrix only support fp4/fp8 dtype on current device|implicit instantiation
    of undefined template ''(?:void )?AscendC::MmadMx(?:<[^'']*|'')'
  phase: kernel_compile
  category: kernel_compile_error
  conditional_advice: >-
    FP8/MX 断言或未定义模板不能单独证明 arch 不匹配。先固定失败编译单元的真实编译 argv、SDK版本、目标及相关宏，
    分别核 TypeFromId 映射、实际类型别名/builtin、MX 重载的声明与实现门控。已核 9.0/9.1 头中的 TypeFromId
    门控不等于类型名不可见；部分设备分支中的 FP8/FP4 别名可退化为 uint8_t，Host/CPU_DEBUG 分支需另核，
    名称可见不证明 FP8 数值语义或 MX 运算能力。v9.1 的 MmadMx 实现受 3510 门控，不把它泛化为所有版本或所有 FP8 入口。
    对当前目标可用的入口，按实际 SupportType/重载声明核 mx_ L0 标签、存储 dtype 与 scale 配对
    （如 mx_fp8_e4m3_t 与 fp8_e4m3fn_t），不能互换。保留用户已确定的目标、dtype、布局与 scale 语义，
    不把换目标或换类型当默认修法；先修有证据的声明、参数或构建配置偏差。只有用户授权改变任务约束后才评估替代方案。
    若无保持原语义的可用实现，明确能力缺口；不虚构类型、不删 scale 或改 golden 来换取编译通过。
  applicability_reasons:
  - build_target_arch_flags_unverified
  - mx_dtype_pairing_and_arch_gate_unverified
  evidence_scope: compiler_diagnostic
  example_message: 'static assertion failed: MmadMx not support data type on current
    device!'
