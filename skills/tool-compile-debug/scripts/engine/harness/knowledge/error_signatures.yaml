# Additional conditional signatures for architecture-gated APIs. These rules
# require target, template, and declaration evidence; they intentionally emit
# conditional advice rather than an unconditional patch.

# f1 MX group constant is unavailable when the 3510-gated declaration is not
# visible before the use site.
- id: mx_scale_group_num_undeclared
  regex: 'use of undeclared identifier ''MX_SCALE_GROUP_NUM'''
  phase: kernel_compile
  category: kernel_compile_error
  conditional_advice: '该常量在 Catlass 头里按 arch 门控定义（3510 面），未声明不等于可在本地自造同名常量。先核当前目标与 CATLASS_ARCH/include
    面：常量可见时用准确限定名或既有 using 引入（did-you-mean 给出的 Catlass:: 候选只是检索线索，不证明语义等价）；当前安装确实不含它时，按当前依赖版本的 MX 契约核
    scale dtype、组大小与布局约束后再定常量来源，不改数据/scale dtype 与 golden。'
  applicability_reasons:
  - arch_gated_constant_visibility_unverified
  evidence_scope: compiler_diagnostic
  example_message: 'use of undeclared identifier ''MX_SCALE_GROUP_NUM''; did you mean ''Catlass::MX_SCALE_GROUP_NUM''?'

# f2 CopyL0CToUBMode has a target-gated member set; an unknown split-axis member
# usually indicates an incorrect template argument or target.
- id: copy_l0c_to_ub_mode_misuse
  regex: 'no member named ''\w+'' in ''Catlass::Gemm::Tile::CopyL0CToUBMode''|use of undeclared identifier ''CopyL0CToUBMode'''
  phase: kernel_compile
  category: kernel_compile_error
  conditional_advice: CopyL0CToUBMode 是按 arch 门控的 L0C→UB 搬运模式枚举，成员集合以当前安装头为准。报 no member 说明枚举类型已解析而成员名不在集合内：先读该枚举完整成员与各分裂轴语义，再按原搬运的分裂需求选已存在成员；不凭
    M/N/K 轴直觉造不存在的成员名，也不为编过改用 NO_SPLIT 等改变输出布局语义的成员。
  applicability_reasons:
  - enum_member_set_and_axis_semantics_unverified
  evidence_scope: compiler_diagnostic
  example_message: 'no member named ''SPLIT_K'' in ''Catlass::Gemm::Tile::CopyL0CToUBMode'''

# f3 PackedTileCopyTlaToUB requires the target-gated template and its declared
# layout argument order; a near-name suggestion is not an equivalent template.
- id: packed_tile_copy_tla_to_ub_misuse
  regex: 'no viable conversion from ''[^'']+'' to ''[^'']*PackedTileCopyTlaToUB<|no template named ''PackedTileCopyTlaToUB'''
  phase: kernel_compile
  category: api_incompatible
  conditional_advice: 该族多为 PackedTileCopyTlaToUB 模板实参错位（元素类型与布局标签位置互换）或目标面不含此模板。先按当前安装头核模板形参序列与各参语义，再逐参比对元素类型/布局标签；诊断若建议近名
    PackedTileCopyTla（无 ToUB 后缀），注意那是另一模板，替换前须核其搬运目标面；确属目标面门控缺失时核 CATLASS_ARCH/目标，而不是删搬运或改 tile 形状迁就错误实参。
  applicability_reasons:
  - template_parameter_mapping_and_target_face_unverified
  evidence_scope: compiler_diagnostic
  example_message: 'no viable conversion from ''Layout<tla::tuple<unsigned int, unsigned int>, tla::tuple<long, tla::C<1>>, tla::tuple<unsigned int, unsigned int>>'' to ''Catlass::Gemm::Kernel::QuantMatmulPerGroupPerBlockTla<Catlass::GemmCoord, Catlass::Gemm::Block::BlockMmadTla<Catlass::Gemm::MmadPingpongPertile<Catlass::Arch::Ascend950, false>, tla::tuple<tla::C<256>, tla::C<128>, tla::C<128>>, tla::tuple<tla::C<256>, tla::C<128>, tla::C<128>>, signed char, signed char, int, void, Catlass::Gemm::Tile::PackedTileCopyTlaToUB<Catlass::Arch::Ascend950, signed char, Catlass::layout::RowMajor, signed char, Catlass::layout::RowMajor, Catlass::layout::RowMajor, int, void, Catlass::Gemm::Tile::CopyL0CToUBMode::SPLIT_M, false, Catlass::Gemm::Tile::ScaleGranularity::NO_QUANT>, Catlass::Gemm::Tile::TileMmadTla<Catlass::Arch::Ascend950, signed char, Catlass::layout::zN>>, Catlass::Epilogue::Block::BlockEpilogue<Catlass::Epilogue::BlockEpiloguePertile, tla::tuple<tla::C<256>, tla::C<128>, tla::C<128>>, half, int, void, float, float, Catlass::layout::RowMajor, Catlass::layout::RowMajor>, Catlass::Gemm::Block::BlockSchedulerAswt<tla::tuple<tla::C<256>, tla::C<128>, tla::C<128>>, tla::tuple<tla::C<256>, tla::C<128>, tla::C<128>>, false>>::LayoutC'' (aka ''int'')'

# f4 MicroAPI is visible only on its device-compilation architecture branches in
# kernel_macros.h; compiling a register-mask helper as host code hides it.
- id: microapi_namespace_gated
  regex: 'no member named ''MicroAPI'' in namespace ''AscendC'''
  phase: kernel_compile
  category: kernel_compile_error
  conditional_advice: MicroAPI 是 AscendC 下按目标 arch 建立的命名空间别名，仅设备编译面可见。该名不可达时分两层核：①使用点是否设备代码——缺 __vector__/__aicore__
    等属性的工具函数按 host 代码编译，别名与寄存器类型天然不可见；②当前目标 arch 是否在别名门控清单内。两层确认后再修限定名或把函数移回设备侧；不能把寄存器/掩码 API 改写成标量循环或删除掩码逻辑。
  applicability_reasons:
  - device_context_and_arch_gate_unverified
  evidence_scope: compiler_diagnostic
  example_message: 'no member named ''MicroAPI'' in namespace ''AscendC'''

# f5 VECTOR_REG_WIDTH is defined per architecture branch; using it from host
# code or a different branch makes the name unavailable.
- id: vector_reg_width_not_visible
  regex: 'no member named ''VECTOR_REG_WIDTH(_2XVL)?'' in namespace ''AscendC'''
  phase: kernel_compile
  category: kernel_compile_error
  conditional_advice: VECTOR_REG_WIDTH 是 AscendC 命名空间内按 __NPU_ARCH__ 门控的常量（设备编译面）。no member 形态说明命名空间可见而该常量在当前编译上下文未定义：先核使用点是否设备代码、当前目标是否定义该常量、以及需要的是向量位宽还是
    2XVL 变体；host 侧需要的宽度应经参数或 host 可见声明传入，不在 host 代码硬编码数值冒充门控常量，也不据此改向量处理结构。
  applicability_reasons:
  - device_context_and_arch_gate_unverified
  evidence_scope: compiler_diagnostic
  example_message: 'no member named ''VECTOR_REG_WIDTH'' in namespace ''AscendC'''
