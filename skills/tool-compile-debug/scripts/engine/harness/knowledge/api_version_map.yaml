# KB — AscendC API version migration map
#
# 用途：为诊断和修复提供可核对的版本迁移线索。调用方只在撞到
# `use of undeclared identifier 'X'` / `no member named 'X'` 且 X 是**已知废弃/改名**的 AscendC
# 符号时，由 cause_tree 出示 old→new 历史候选；短名或 deprecated 字样不证明迁移适用。
#
# 来源记录（若缺少完整构建信息或对象契约，不作当前支持结论）：
#   /usr/local/Ascend/ascend-toolkit/latest/asc/include 里的 `[[deprecated("...use X instead...")]]`
#   标记。每条 `provenance` 字段记录来源头文件。
#
# Schema（list of dict）：
#   old_name:      报错里出现的旧/错名（编译器报 undeclared/no-member 的符号；ops 包
#                  迁移对用「仓/路径」形态——REG_OP 名不变，错的是打包路径）
#   replacement:   本版本应改用的真实名（来自 deprecated 消息的 "use X instead"）
#   kind:          renamed | deprecated_pending_removal | typo_fixed | api_redesign | relocated
#   since:         新名/新路径出现的版本（Version-specific 起；改名对缺省视为 kb_floor 域内已知）
#   removed_in:    自哪个版本起移除/不可用（"unknown" = 头只标 deprecated 未给确切版本）
#   namespace:     符号所属命名空间（多为 AscendC / AscendC::Hccl）
#   arch_gate:     可选；该符号仅在这些 __NPU_ARCH__ 下存在（见 harness/knowledge/soc_feature_matrix.yaml）
#   note:          一行修复方向
#   provenance:    可核对的头文件路径与 deprecated 原文
#
# The map contains SDK facts, not case-specific source literals.

