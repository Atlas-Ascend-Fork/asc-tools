- name: MakeMxScaleLayout
  namespace: tla
  kind: function_template
  header: include/tla/layout.hpp
  api_level: catlass_tla
  category: mx_scale
  signature: template <class Element, class LayoutTag, bool isMxScaleB, class T, class
    U> CATLASS_HOST_DEVICE constexpr auto MakeMxScaleLayout(T const& rows, U const&
    cols)
  return_type: auto (MX scale packed layout)
  params:
  - T const& rows
  - U const& cols
  modifiers:
  - constexpr
  template_params: class Element, class LayoutTag, bool isMxScaleB, class T, class
    U
  brief: 'CANN 9.0 catlass/tla MX scale-factor packed layout builder, dav-3510 only
    (guarded by CATLASS_ARCH == 3510). Element must be float8_e8m0_t; LayoutTag one
    of RowMajor/ColumnMajor/zZ/nN. One scale factor per MX group of MX_SCALE_GROUP_NUM(=32)
    data elements; scale factors are packed 2 per C0 (ELE_NUM_PER_C0=2, ELE_NUM_PER_FRACTAL=32).
    isMxScaleB=false builds the A-side (row-oriented) scale layout from (rows, groups);
    isMxScaleB=true builds the B-side (column-oriented) scale layout from (groups,
    cols). The A/B pair must match the TileCopy LayoutTagA/LayoutTagB of the consuming
    matmul kernel template; a mismatch is a compile-time layout-binding failure at
    the kernel instantiation site. Group count along K = CeilDiv<MX_SCALE_GROUP_NUM>(k);
    pack scale buffers per the 2-per-C0 packing when computing aligned extents (RoundUp<2>
    on group count). Source: catlass include/tla/layout.hpp (3510 branch), include/catlass/catlass.hpp.'
  quality_status: ok
  quality_issues: []
- name: MX_SCALE_GROUP_NUM
  namespace: Catlass
  kind: constexpr_constant
  header: include/catlass/catlass.hpp
  api_level: catlass_tla
  category: mx_scale
  signature: constexpr uint32_t MX_SCALE_GROUP_NUM = 32
  return_type: ''
  params: []
  modifiers:
  - constexpr
  template_params: ''
  brief: 'Data count for one MX-scale factor per group in CANN 9.0 catlass: 32 data
    elements share one float8_e8m0_t scale factor. Group count along K = CeilDiv<MX_SCALE_GROUP_NUM>(k).
    Scale factors are packed 2 per C0 in tla::MakeMxScaleLayout layouts (ELE_NUM_PER_C0=2),
    so allocated/passed scale extents use the group count aligned up to 2 (RoundUp<2>).
    Source: catlass include/catlass/catlass.hpp.'
  quality_status: ok
  quality_issues: []
