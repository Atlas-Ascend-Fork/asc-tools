[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aprof-runtime"
version = "0.8.3"
description = "Machine-authoritative runtime contracts for AProf SkillGraph training"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.18", "numpy>=1.24", "pytest-xdist>=3"]

[project.scripts]
aprofctl = "aprof_runtime.cli:main"
aprof-runtime = "aprof_runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
