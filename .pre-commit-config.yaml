minimum_pre_commit_version: 4.0.0
exclude: ^LICENSES/|\.(html|csv|svg)$

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  # pre-commit 基础检查
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^skills/tool-ops-optimize/(?:sources/|skills/[^/]+/(?:sources/|graph/|knowledge/)|workflows/(?:migration/|references/[^/]+/)|runtime/src/aprof_runtime/(?:_diagnosis_v1|_knowledge_v1)\.py$|schemas/|skills/[^/]+/(?:LICENSE|NOTICE\.md)$)
      - id: end-of-file-fixer
        exclude: ^skills/tool-ops-optimize/(?:sources/|skills/[^/]+/(?:sources/|graph/|knowledge/)|workflows/(?:migration/|references/[^/]+/)|runtime/src/aprof_runtime/(?:_diagnosis_v1|_knowledge_v1)\.py$|schemas/|skills/[^/]+/(?:LICENSE|NOTICE\.md)$)
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
        exclude: (?:^skills/tool-ops-optimize/(?:sources/|skills/[^/]+/(?:sources/|graph/|knowledge/)|workflows/(?:migration/|references/[^/]+/)|runtime/src/aprof_runtime/(?:_diagnosis_v1|_knowledge_v1)\.py$|schemas/|skills/[^/]+/(?:LICENSE|NOTICE\.md)$))|^skills/tool-ops-optimize/tools/frozen-files.json$
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json
        exclude: ^\.devcontainer/devcontainer\.json$

  # C++ 代码格式化检查
  - repo: https://gitcode.com/pre-commit-clang/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx|asc)$
        exclude: (?:^build/|tests/third_party/)|(?:^skills/tool-ops-optimize/(?:sources/|skills/[^/]+/(?:sources/|graph/|knowledge/)|workflows/(?:migration/|references/[^/]+/)|runtime/src/aprof_runtime/(?:_diagnosis_v1|_knowledge_v1)\.py$|schemas/|skills/[^/]+/(?:LICENSE|NOTICE\.md)$))
        args:
          - "--style=file"
          - "--verbose"
          - "-i"

  # Python 代码检查和格式化
  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        exclude: ^skills/tool-ops-optimize/(?:sources/|skills/[^/]+/(?:sources/|graph/|knowledge/)|workflows/(?:migration/|references/[^/]+/)|runtime/src/aprof_runtime/(?:_diagnosis_v1|_knowledge_v1)\.py$|schemas/|skills/[^/]+/(?:LICENSE|NOTICE\.md)$)
        args: ["--output-format", "github", "--fix"]
        types: [python]
      - id: ruff-format
        exclude: ^skills/tool-ops-optimize/(?:sources/|skills/[^/]+/(?:sources/|graph/|knowledge/)|workflows/(?:migration/|references/[^/]+/)|runtime/src/aprof_runtime/(?:_diagnosis_v1|_knowledge_v1)\.py$|schemas/|skills/[^/]+/(?:LICENSE|NOTICE\.md)$)
        types: [python]

  # 拼写检查
  - repo: https://gitcode.com/gh_mirrors/co/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        exclude: ^skills/tool-ops-optimize/(?:sources/|skills/[^/]+/(?:sources/|graph/|knowledge/)|workflows/(?:migration/|references/[^/]+/)|runtime/src/aprof_runtime/(?:_diagnosis_v1|_knowledge_v1)\.py$|schemas/|skills/[^/]+/(?:LICENSE|NOTICE\.md)$)
        args: [
            "--write-changes",
            "-L",
            "CANN,cann,NNAL,nnal,ASCEND,ascend,EnQue,CopyIn,ArchType,AND,ND,tbe,copyin,alog,commiter,abl,thirdparty,enque,offsett,outter,regist,msaicerr,aicore,asys,symbolizer,plog,ffts,fixp,FIXP,Te,IndexType,CblkLen",
            "--skip",
            "*.py,*.cpp,*.hpp,*.c,*.h",
          ]

  # OAT 合规性检查 (Open Source Audit Tool)
  - repo: https://gitcode.com/HiAgent/compliance
    rev: v1.0.6
    hooks:
      - id: oat-check
        pass_filenames: true
        exclude: (?:^skills/tool-ops-optimize/LICENSE$)|(?:^skills/tool-ops-optimize/(?:sources/|skills/[^/]+/(?:sources/|graph/|knowledge/)|workflows/(?:migration/|references/[^/]+/)|runtime/src/aprof_runtime/(?:_diagnosis_v1|_knowledge_v1)\.py$|schemas/|skills/[^/]+/(?:LICENSE|NOTICE\.md)$))
        stages: [pre-commit]
        verbose: true

  # Byte-frozen sources and versioned compilers are validated rather than rewritten.
  - repo: local
    hooks:
      - id: graph-base-payload
        name: Verify AProf frozen sources and workflow entries
        entry: python3 skills/tool-ops-optimize/tools/check_import.py
        language: system
        files: ^skills/tool-ops-optimize/
        pass_filenames: false
