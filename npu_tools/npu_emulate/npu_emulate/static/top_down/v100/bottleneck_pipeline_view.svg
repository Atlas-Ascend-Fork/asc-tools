<svg viewBox="0 0 15.6 8" xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#475569"/></marker>
  <filter id="glowRed"><feDropShadow dx="0" dy="0" stdDeviation="0.05" flood-color="#ef4444" flood-opacity="0.6"/></filter>
</defs>
<rect width="15.6" height="8" fill="#ffffff"/>

<!-- Front-End band -->
<rect x="0.2" y="0.4" width="5.7" height="7.2" fill="#e0e7ff" stroke="#cbd5e1" stroke-width="0.02"/>
<text x="0.35" y="0.85" font-size="0.28" font-weight="700" fill="#64748b">Front-End</text>

<!-- Back-End band -->
<rect x="6.0" y="0.4" width="9.8" height="7.2" fill="#ffedd5" stroke="#cbd5e1" stroke-width="0.02"/>
<text x="6.15" y="0.85" font-size="0.28" font-weight="700" fill="#64748b">Back-End</text>

<!-- Arrows -->
<line x1="2.8" y1="4.025" x2="3.1" y2="4.025" stroke="#475569" stroke-width="0.025" marker-end="url(#arrow)"/>
<line x1="5.2" y1="4.025" x2="6.2" y2="4.025" stroke="#475569" stroke-width="0.025" marker-end="url(#arrow)"/>
<line x1="10.0" y1="3.4" x2="10.2" y2="3.4" stroke="#475569" stroke-width="0.025" marker-end="url(#arrow)"/>
<line x1="10.0" y1="4.8" x2="10.2" y2="4.8" stroke="#475569" stroke-width="0.025" marker-end="url(#arrow)"/>
<line x1="10.0" y1="6.2" x2="10.2" y2="6.2" stroke="#475569" stroke-width="0.025" marker-end="url(#arrow)"/>
<path d="M11.7,4.8 Q12.5,3.6 13.3,4.0" fill="none" stroke="#475569" stroke-width="0.025" marker-end="url(#arrow)"/>
<path d="M11.7,6.3 Q12.5,4.4 13.3,4.4" fill="none" stroke="#475569" stroke-width="0.025" marker-end="url(#arrow)"/>

<!-- IFU (leaf, metric=fetch_latency) -->
<g id="block_ifu">
  <rect class="block-shape" x="0.70" y="3.35" width="2.10" height="1.35" rx="0.08" fill="#94a3b8" stroke="#64748b" stroke-width="0.025"/>
  <text x="1.75" y="3.91" text-anchor="middle" font-size="0.24" font-weight="700" fill="#ffffff">IFU</text>
  <text x="1.75" y="4.21" text-anchor="middle" font-size="0.20" fill="#ffffff" font-family="monospace"><tspan id="fetch_latency_pct">0.0%</tspan></text>
</g>

<!-- IDU (leaf, metric=fetch_bandwidth) -->
<g id="block_idu">
  <rect class="block-shape" x="3.10" y="3.35" width="2.10" height="1.35" rx="0.08" fill="#94a3b8" stroke="#64748b" stroke-width="0.025"/>
  <text x="4.15" y="3.91" text-anchor="middle" font-size="0.24" font-weight="700" fill="#ffffff">IDU</text>
  <text x="4.15" y="4.21" text-anchor="middle" font-size="0.20" fill="#ffffff" font-family="monospace"><tspan id="fetch_bandwidth_pct">0.0%</tspan></text>
</g>

<!-- VEC (container) -->
<g id="block_vec">
  <rect x="6.20" y="1.50" width="5.70" height="5.60" rx="0.10" fill="#f1f5f9" stroke="#475569" stroke-width="0.03"/>
  <text x="6.32" y="1.78" font-size="0.26" font-weight="700" fill="#1e293b">VEC</text>

  <!-- OOO/ISU (container) -->
  <g id="block_ooo_isu">
    <rect x="6.40" y="2.20" width="3.60" height="3.50" rx="0.10" fill="#f1f5f9" stroke="#475569" stroke-width="0.03"/>
    <text x="6.52" y="2.48" font-size="0.26" font-weight="700" fill="#1e293b">OOO / ISU</text>

    <!-- LDQ -->
    <g id="block_ldq">
      <rect class="block-shape" x="6.60" y="2.80" width="1.50" height="1.20" rx="0.08" fill="#94a3b8" stroke="#64748b" stroke-width="0.025"/>
      <text x="7.35" y="3.28" text-anchor="middle" font-size="0.22" font-weight="700" fill="#ffffff">LDQ</text>
      <text x="7.35" y="3.58" text-anchor="middle" font-size="0.18" fill="#ffffff" font-family="monospace"><tspan id="ldq_stall_pct">0.0%</tspan></text>
    </g>

    <!-- SHQ -->
    <g id="block_shq">
      <rect class="block-shape" x="8.30" y="2.80" width="1.50" height="1.20" rx="0.08" fill="#94a3b8" stroke="#64748b" stroke-width="0.025"/>
      <text x="9.05" y="3.28" text-anchor="middle" font-size="0.22" font-weight="700" fill="#ffffff">SHQ</text>
      <text x="9.05" y="3.58" text-anchor="middle" font-size="0.18" fill="#ffffff" font-family="monospace"><tspan id="shq_stall_pct">0.0%</tspan></text>
    </g>

    <!-- VREG -->
    <g id="block_vreg">
      <rect class="block-shape" x="6.60" y="4.20" width="1.50" height="1.20" rx="0.08" fill="#94a3b8" stroke="#64748b" stroke-width="0.025"/>
      <text x="7.35" y="4.68" text-anchor="middle" font-size="0.22" font-weight="700" fill="#ffffff">VREG</text>
      <text x="7.35" y="4.98" text-anchor="middle" font-size="0.18" fill="#ffffff" font-family="monospace"><tspan id="phy_vreg_stall_pct">0.0%</tspan></text>
    </g>

    <!-- PREG -->
    <g id="block_preg">
      <rect class="block-shape" x="8.30" y="4.20" width="1.50" height="1.20" rx="0.08" fill="#94a3b8" stroke="#64748b" stroke-width="0.025"/>
      <text x="9.05" y="4.68" text-anchor="middle" font-size="0.22" font-weight="700" fill="#ffffff">PREG</text>
      <text x="9.05" y="4.98" text-anchor="middle" font-size="0.18" fill="#ffffff" font-family="monospace"><tspan id="phy_preg_stall_pct">0.0%</tspan></text>
    </g>
  </g>

  <!-- EXU (vec, metric=ex_issue_stall) -->
  <g id="block_vec_exu">
    <rect class="block-shape" x="10.20" y="2.80" width="1.50" height="1.20" rx="0.08" fill="#94a3b8" stroke="#64748b" stroke-width="0.025"/>
    <text x="10.95" y="3.28" text-anchor="middle" font-size="0.22" font-weight="700" fill="#ffffff">EXU</text>
    <text x="10.95" y="3.58" text-anchor="middle" font-size="0.18" fill="#ffffff" font-family="monospace"><tspan id="ex_issue_stall_pct">0.0%</tspan></text>
  </g>

  <!-- LDU -->
  <g id="block_ldu">
    <rect class="block-shape" x="10.20" y="4.20" width="1.50" height="1.20" rx="0.08" fill="#94a3b8" stroke="#64748b" stroke-width="0.025"/>
    <text x="10.95" y="4.68" text-anchor="middle" font-size="0.22" font-weight="700" fill="#ffffff">LDU</text>
    <text x="10.95" y="4.98" text-anchor="middle" font-size="0.18" fill="#ffffff" font-family="monospace"><tspan id="ld_issue_stall_pct">0.0%</tspan></text>
  </g>

  <!-- STU -->
  <g id="block_stu">
    <rect class="block-shape" x="10.20" y="5.60" width="1.50" height="1.20" rx="0.08" fill="#94a3b8" stroke="#64748b" stroke-width="0.025"/>
    <text x="10.95" y="6.08" text-anchor="middle" font-size="0.22" font-weight="700" fill="#ffffff">STU</text>
    <text x="10.95" y="6.38" text-anchor="middle" font-size="0.18" fill="#ffffff" font-family="monospace"><tspan id="st_issue_stall_pct">0.0%</tspan></text>
  </g>
</g>

<!-- UB (structural, no metric) -->
<g id="block_ub">
  <rect class="block-shape" x="13.30" y="3.35" width="2.10" height="1.35" rx="0.08" fill="#94a3b8" stroke="#64748b" stroke-width="0.025"/>
  <text x="14.35" y="4.05" text-anchor="middle" font-size="0.24" font-weight="700" fill="#ffffff">UB</text>
</g>

</svg>
